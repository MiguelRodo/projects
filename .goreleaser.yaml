version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: projectctl
    main: ./cmd/projectctl
    binary: projectctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/MiguelRodo/projects/pkg/version.Version={{.Version}}
      - -X github.com/MiguelRodo/projects/pkg/version.GitCommit={{.Commit}}
      - -X github.com/MiguelRodo/projects/pkg/version.BuildDate={{.Date}}

  - id: projects
    main: ./cmd/projects
    binary: projects
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/MiguelRodo/projects/pkg/version.Version={{.Version}}
      - -X github.com/MiguelRodo/projects/pkg/version.GitCommit={{.Commit}}
      - -X github.com/MiguelRodo/projects/pkg/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
