apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: per-issue-node-id
  target:
    ref: primary
    issueStore: {owner: {kind: organization, login: example-org}, repository: privacy-tasks}
    project: {owner: {kind: organization, login: example-org}, number: 81}
  fields: {}
  privacy:
    supportedModes: [shareable_by_default]
    defaultMode: shareable_by_default
    companion:
      linkage:
        kind: github_issue_node_id
        issueNodeId: I_SYNTHETIC_001
  sourceRefs: []
  requirements: {features: [issues, projects-v2], mutations: []}
