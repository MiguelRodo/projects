apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: full-default
  target:
    ref: primary
    issueStore: {owner: {kind: organization, login: example-org}, repository: full-default-tasks}
    project: {owner: {kind: organization, login: example-org}, number: 75}
  fields: {}
  privacy:
    supportedModes: [shareable_by_default, full_github_context]
    defaultMode: full_github_context
  sourceRefs: []
  dimensions: {}
  dimensionBindings: {}
  labels:
    declarations: {}
    projectRouting:
      kind: repository_scope
  requirements: {features: [issues, projects-v2], mutations: []}
