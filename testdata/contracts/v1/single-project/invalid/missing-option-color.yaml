apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: alpha
  target:
    ref: primary
    issueStore: {owner: {kind: organization, login: example-org}, repository: alpha-tasks}
    project: {owner: {kind: organization, login: example-org}, number: 1}
  fields:
    status:
      name: Status
      dataType: singleSelect
      values:
        ready: {name: Ready, description: Ready to start.}
  sourceRefs: []
  requirements: {features: [issues, project-custom-fields, projects-v2], mutations: []}
