apiVersion: projectctl/v2
kind: SingleProjectRepository
spec:
  ref: alpha
  target:
    ref: primary
    issueStore:
      owner: {kind: organization, login: example-org}
      repository: alpha-tasks
    project:
      owner: {kind: organization, login: example-org}
      number: 1
  fields: {}
  sourceRefs: []
  labels:
    declarations: {}
    projectRouting:
      kind: repository_scope
  requirements: {features: [issues, projects-v2], mutations: []}
