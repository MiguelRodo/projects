apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: alpha
  target:
    ref: primary
    issueStore:
      owner: {kind: organization, login: example-org}
      repository: alpha-tasks
    project:
      owner: {kind: organization, login: example-org}
      number: 1
  fields:
    status:
      name: Status
      dataType: singleSelect
      values:
        ready: {name: Ready, color: green, description: Ready to start.}
        also-ready: {name: Ready, color: blue, description: Duplicate selector.}
  dimensions: {}
  dimensionBindings: {}
  sourceRefs: []
  labels:
    declarations: {}
    projectRouting:
      kind: repository_scope
  requirements: {features: [issues, project-custom-fields, projects-v2], mutations: []}
