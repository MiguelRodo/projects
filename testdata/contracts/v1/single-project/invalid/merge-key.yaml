apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: alpha
  target:
    ref: primary
    issueStore:
      owner: &base-owner {kind: organization, login: example-org}
      repository: alpha-tasks
    project:
      owner:
        <<: *base-owner
      number: 1
  fields: {}
  sourceRefs: []
  requirements: {features: [issues, projects-v2], mutations: []}
