apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: mutation-scopes
  target:
    ref: primary
    issueStore:
      owner:
        kind: organization
        login: example-org
      repository: mutation-tasks
    project:
      owner:
        kind: organization
        login: example-org
      number: 11
  fields:
    state:
      name: State
      dataType: singleSelect
      values:
        open:
          name: Open
          color: blue
          description: ""
  sourceRefs:
    - architecture
    - handbook
  dimensions: {}
  dimensionBindings: {}
  labels:
    declarations: {}
    projectRouting:
      kind: repository_scope
  requirements:
    features:
      - issue-relationships
      - issues
      - project-custom-fields
      - project-item-membership
      - projects-v2
    mutations:
      - issue.assignee.add
      - issue.assignee.remove
      - issue.body.write
      - issue.create
      - issue.dependency.add
      - issue.dependency.remove
      - issue.milestone.write
      - issue.parent.remove
      - issue.parent.set
      - issue.state.write
      - issue.title.write
      - project.field.create
      - project.field.option.create
      - project.item.add
      - project.item.field.write
      - project.item.remove
