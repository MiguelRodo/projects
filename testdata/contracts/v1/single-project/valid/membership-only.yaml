apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: membership-only
  target:
    ref: primary
    issueStore:
      owner:
        kind: organization
        login: example-org
      repository: membership-tasks
    project:
      owner:
        kind: user
        login: example-user
      number: 3
  fields: {}
  sourceRefs: []
  dimensions: {}
  dimensionBindings: {}
  labels:
    declarations: {}
    projectRouting:
      kind: repository_scope
  requirements:
    features:
      - issues
      - project-item-membership
      - projects-v2
    mutations:
      - project.item.add
