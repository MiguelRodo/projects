apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: duplicate-route-ref
  targets:
    - target:
        ref: alpha
        issueStore: {owner: {kind: organization, login: example-org}, repository: shared-tasks}
        project: {owner: {kind: organization, login: example-org}, number: 1}
      fields: {}
    - target:
        ref: beta
        issueStore: {owner: {kind: organization, login: example-org}, repository: shared-tasks}
        project: {owner: {kind: organization, login: example-org}, number: 2}
      fields: {}
  routing:
    rules:
      - ref: duplicate-route
        labelsAll: [area:alpha]
        targetRef: alpha
      - ref: duplicate-route
        labelsAll: [area:beta]
        targetRef: beta
    fallback: {kind: error}
  sourceRefs: []
  requirements: {features: [issues, projects-v2], mutations: []}
