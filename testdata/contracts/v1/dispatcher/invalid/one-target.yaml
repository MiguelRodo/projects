apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: one-target
  targets:
    - target:
        ref: only
        issueStore: {owner: {kind: organization, login: example-org}, repository: shared-tasks}
        project: {owner: {kind: organization, login: example-org}, number: 1}
      fields: {}
  routing:
    rules: []
    fallback: {kind: target, targetRef: only}
  sourceRefs: []
  requirements: {features: [issues, projects-v2], mutations: []}
