apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: field-write-missing-membership
  targets:
  - target:
      ref: alpha
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: shared-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 1
    fields:
      notes:
        name: Notes
        dataType: text
    dimensionBindings: {}
  - target:
      ref: beta
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: shared-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 2
    fields: {}
    dimensionBindings: {}
  dimensions: {}
  routing:
    rules:
    - ref: route-1
      labelRef: route-1
      targetRef: alpha
    - ref: route-2
      labelRef: route-2
      targetRef: beta
    fallback:
      kind: error
  sourceRefs: []
  requirements:
    features:
    - issues
    - project-custom-fields
    - projects-v2
    - issue-labels
    mutations:
    - project.item.field.write
  labels:
    declarations:
      route-1:
        name: project:route-1
        color: 1f6feb
        description: Routes issues to target alpha.
        role:
          kind: project_route
          targetRef: alpha
      route-2:
        name: project:route-2
        color: 1f6feb
        description: Routes issues to target beta.
        role:
          kind: project_route
          targetRef: beta
    projectRouting:
      kind: required_label
