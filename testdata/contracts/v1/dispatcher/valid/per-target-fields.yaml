apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: mapped-work
  targets:
  - target:
      ref: delivery
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: mapped-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 41
    fields:
      state:
        name: Work state
        dataType: singleSelect
        values:
          active:
            name: Active
            color: blue
            description: Delivery is active.
  - target:
      ref: research
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: mapped-tasks
      project:
        owner:
          kind: user
          login: example-user
        number: 42
    fields:
      state:
        name: Work state
        dataType: singleSelect
        values:
          active:
            name: Active
            color: purple
            description: Research is active.
      evidence:
        name: Evidence
        dataType: text
  routing:
    rules:
    - ref: route-1
      labelRef: route-1
      targetRef: delivery
    - ref: route-2
      labelRef: route-2
      targetRef: research
    fallback:
      kind: error
  sourceRefs:
  - handbook
  requirements:
    features:
    - issues
    - project-custom-fields
    - project-item-membership
    - projects-v2
    - issue-labels
    mutations:
    - project.item.field.write
  labels:
    declarations:
      route-1:
        name: project:route-1
        color: 1f6feb
        description: Routes issues to target delivery.
        role:
          kind: project_route
          targetRef: delivery
      route-2:
        name: project:route-2
        color: 1f6feb
        description: Routes issues to target research.
        role:
          kind: project_route
          targetRef: research
    projectRouting:
      kind: required_label
