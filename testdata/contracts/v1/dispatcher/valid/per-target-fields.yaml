apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: mapped-work
  targets:
    - target:
        ref: delivery
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: mapped-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 41
      fields:
        state:
          name: Work state
          dataType: singleSelect
          values:
            active:
              name: Active
              color: blue
              description: Delivery is active.
    - target:
        ref: research
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: mapped-tasks
        project:
          owner: {kind: user, login: example-user}
          number: 42
      fields:
        state:
          name: Work state
          dataType: singleSelect
          values:
            active:
              name: Active
              color: purple
              description: Research is active.
        evidence:
          name: Evidence
          dataType: text
  routing:
    rules:
      - ref: research-route
        labelsAll: [area:research]
        targetRef: research
    fallback: {kind: target, targetRef: delivery}
  sourceRefs: [handbook]
  requirements:
    features:
      - issues
      - project-custom-fields
      - project-item-membership
      - projects-v2
    mutations:
      - project.item.field.write
