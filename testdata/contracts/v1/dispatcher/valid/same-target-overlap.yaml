apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: same-target-overlap
  targets:
    - target:
        ref: delivery
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: overlap-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 61
      fields: {}
    - target:
        ref: triage
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: overlap-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 62
      fields: {}
  routing:
    rules:
      - ref: delivery-area
        labelsAll: [area:delivery]
        targetRef: delivery
      - ref: urgent-work
        labelsAll: [priority:urgent]
        targetRef: delivery
    fallback: {kind: target, targetRef: triage}
  sourceRefs: []
  requirements:
    features: [issues, projects-v2]
    mutations: []
