apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: strict-routing
  targets:
    - target:
        ref: api
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: strict-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 21
      fields: {}
    - target:
        ref: web
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: strict-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 22
      fields: {}
  routing:
    rules:
      - ref: api-route
        labelsAll: [area:api, tier:service]
        targetRef: api
      - ref: web-route
        labelsAll: [area:web]
        targetRef: web
    fallback: {kind: error}
  sourceRefs: []
  requirements:
    features: [issues, projects-v2]
    mutations: []
