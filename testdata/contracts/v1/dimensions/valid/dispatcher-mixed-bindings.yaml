apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: mixed-storage
  targets:
    - target:
        ref: custom
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: central-tasks
        project:
          owner: {kind: user, login: example-user}
          number: 21
      fields:
        class:
          name: Class
          dataType: singleSelect
          values:
            task: {name: Task, color: gray, description: A specific piece of work.}
            bug: {name: Bug, color: red, description: An unexpected fault.}
        priority:
          name: Priority
          dataType: singleSelect
          values:
            p0: {name: P0, color: red, description: Urgent.}
            p1: {name: P1, color: orange, description: Important.}
            p2: {name: P2, color: blue, description: Useful.}
      dimensionBindings:
        class:
          kind: project_field
          fieldRef: class
          values:
            task: {readValueRefs: [task], writeValueRef: task}
            bug: {readValueRefs: [bug], writeValueRef: bug}
        priority:
          kind: project_field
          fieldRef: priority
          values:
            p0: {readValueRefs: [p0], writeValueRef: p0}
            p1: {readValueRefs: [p1], writeValueRef: p1}
            p2: {readValueRefs: [p2], writeValueRef: p2}
        status:
          kind: project_status
          values:
            todo: {readNames: [Todo], writeName: Todo}
            in-progress: {readNames: [In progress], writeName: In progress}
            done: {readNames: [Done], writeName: Done}
    - target:
        ref: native
        issueStore:
          owner: {kind: organization, login: example-org}
          repository: central-tasks
        project:
          owner: {kind: organization, login: example-org}
          number: 22
      fields: {}
      dimensionBindings:
        class:
          kind: issue_type
          values:
            task: {readNames: [Task], writeName: Task}
            bug: {readNames: [Bug], writeName: Bug}
        priority:
          kind: issue_field
          name: Priority
          dataType: singleSelect
          values:
            p0: {readNames: [Urgent], writeName: Urgent}
            p1: {readNames: [High], writeName: High}
            p2: {readNames: [Medium, Low], writeName: Medium}
        status:
          kind: project_status
          values:
            todo: {readNames: [Todo], writeName: Todo}
            in-progress: {readNames: [In Progress], writeName: In Progress}
            done: {readNames: [Done], writeName: Done}
  dimensions:
    class: {values: [task, bug]}
    priority: {values: [p0, p1, p2]}
    status: {values: [todo, in-progress, done]}
  routing:
    rules:
      - {ref: custom-route, labelRef: route-custom, targetRef: custom}
      - {ref: native-route, labelRef: route-native, targetRef: native}
    fallback: {kind: error}
  labels:
    declarations:
      route-custom:
        name: project:custom
        color: 1f6feb
        description: Routes this issue to the custom-field Project.
        role: {kind: project_route, targetRef: custom}
      route-native:
        name: project:native
        color: 8250df
        description: Routes this issue to the native-field Project.
        role: {kind: project_route, targetRef: native}
    projectRouting: {kind: required_label}
  sourceRefs: []
  requirements:
    features: [issue-fields, issue-labels, issue-types, issues, project-custom-fields, project-item-membership, projects-v2]
    mutations: [issue.field.write, issue.type.write, project.item.field.write]
