apiVersion: projectctl/v1
kind: OperatorProfile
spec:
  providers:
    private-resources:
      adapterRef: synthetic-resource-store
  companionDestinations: {}
  workspaces: {}
  integrations:
    alpha-source:
      kind: source
      providerRef: private-resources
      resourceRef: synthetic/source-alpha
      access: read_only
  contractBindings:
    - contract:
        authority: github.com
        owner:
          kind: organization
          login: example-org
        repository: alpha-config
        ref: alpha
      sources:
        shared:
          unknown-hook: alpha-source
        private: []
