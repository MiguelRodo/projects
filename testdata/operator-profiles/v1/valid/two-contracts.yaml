apiVersion: projectctl/v1
kind: OperatorProfile
spec:
  providers: {}
  companionDestinations: {}
  workspaces:
    alpha-workspace:
      path:
        kind: posix_absolute
        value: /synthetic/work/alpha
  integrations: {}
  contractBindings:
    - contract:
        authority: github.com
        owner:
          kind: organization
          login: example-org
        repository: alpha-config
        ref: alpha
      privacy:
        mode: full_github_context
      sources:
        shared: {}
        private: []
    - contract:
        authority: github.com
        owner:
          kind: user
          login: example-user
        repository: beta-config
        ref: beta
      workspaceRef: alpha-workspace
      sources:
        shared: {}
        private: []
