apiVersion: projectctl/v1
kind: DispatcherRepository
spec:
  ref: shared-work
  targets:
  - target:
      ref: backend
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: shared-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 11
    fields:
      work-state:
        name: Backend state
        dataType: singleSelect
        values:
          queued:
            name: Queued
            color: gray
            description: Ready for backend scheduling.
          active:
            name: Active
            color: blue
            description: Backend work is in progress.
  - target:
      ref: frontend
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: shared-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 12
    fields:
      delivery-date:
        name: Frontend delivery date
        dataType: date
  - target:
      ref: triage
      issueStore:
        owner:
          kind: organization
          login: example-org
        repository: shared-tasks
      project:
        owner:
          kind: organization
          login: example-org
        number: 13
    fields: {}
  routing:
    rules:
    - ref: route-1
      labelRef: route-1
      targetRef: backend
    - ref: route-2
      labelRef: route-2
      targetRef: frontend
    - ref: route-3
      labelRef: route-3
      targetRef: triage
    fallback:
      kind: error
  sourceRefs:
  - architecture
  requirements:
    features:
    - issues
    - project-custom-fields
    - project-item-membership
    - projects-v2
    - issue-labels
    mutations:
    - project.item.add
    - project.item.field.write
  labels:
    declarations:
      route-1:
        name: project:route-1
        color: 1f6feb
        description: Routes issues to target backend.
        role:
          kind: project_route
          targetRef: backend
      route-2:
        name: project:route-2
        color: 1f6feb
        description: Routes issues to target frontend.
        role:
          kind: project_route
          targetRef: frontend
      route-3:
        name: project:route-3
        color: 1f6feb
        description: Routes issues to target triage.
        role:
          kind: project_route
          targetRef: triage
    projectRouting:
      kind: required_label
