apiVersion: projectctl/v1
kind: SingleProjectRepository
spec:
  ref: privacy-example
  target:
    ref: primary
    issueStore:
      owner:
        kind: organization
        login: example-org
      repository: privacy-example-tasks
    project:
      owner:
        kind: organization
        login: example-org
      number: 71
  fields: {}
  privacy:
    supportedModes:
      - shareable_by_default
      - full_github_context
    defaultMode: shareable_by_default
    companion:
      linkage:
        kind: github_issue_node_id
  sourceRefs: []
  requirements:
    features:
      - issues
      - projects-v2
    mutations: []
