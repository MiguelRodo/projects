name: Install github-projects skill once

on:
  push:
    branches:
      - pj/install-github-projects-skill
    paths:
      - .github/workflows/install-github-projects-skill-once.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install canonical project-scoped skill
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git clone --depth 1 https://github.com/MiguelRodo/github-projects-skill.git "$tmp/source"
          expected="$(git -C "$tmp/source" rev-parse HEAD:.agents/skills/github-projects)"

          rm -rf .agents/skills/github-projects
          mkdir -p .agents/skills
          cp -a "$tmp/source/.agents/skills/github-projects" .agents/skills/

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          replacement = '''<!-- github-projects:start -->
          ## GitHub issues and Projects

          For GitHub issue or Project administration, use
          `.agents/skills/github-projects/SKILL.md` and read
          `.projects/project.md` before acting.
          <!-- github-projects:end -->'''
          pattern = r'<!-- github-projects:start -->.*?<!-- github-projects:end -->'
          updated, count = re.subn(pattern, replacement, text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one github-projects block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

          rm -f .github/workflows/install-github-projects-skill-once.yml
          git add -A -- .agents/skills AGENTS.md .github/workflows/install-github-projects-skill-once.yml

          root_tree="$(git write-tree)"
          actual="$(git ls-tree "$root_tree" .agents/skills/github-projects | awk '{print $3}')"
          test "$actual" = "$expected"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Install github-projects skill"
          git push origin "HEAD:${GITHUB_REF_NAME}"
