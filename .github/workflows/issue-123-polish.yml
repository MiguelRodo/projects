name: Polish issue 123 wording

on:
  push:
    branches:
      - issue-project-organisation-guidance

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-project-organisation-guidance
      - name: Polish and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path('skills/github-project-admin/scripts/init-project.sh'),
              Path('.agents/skills/github-project-admin/scripts/init-project.sh'),
          ]:
              text = path.read_text()
              old = '  prefer independently meaningful top-level outcomes, propose retiring empty\n  category or standing wrappers where appropriate, and use body checkboxes for\n'
              new = '  prefer independently meaningful top-level outcomes, propose retiring generic\n  category or standing wrappers where appropriate, and use body checkboxes for\n'
              if text.count(old) != 1:
                  raise SystemExit(f'expected one wording match in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          bash skills/github-project-admin/tests/run.sh
          diff -u skills/github-project-admin/scripts/init-project.sh .agents/skills/github-project-admin/scripts/init-project.sh
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/github-project-admin/scripts/init-project.sh .agents/skills/github-project-admin/scripts/init-project.sh
          git commit -m 'Polish project organisation onboarding wording'
          git push origin HEAD:issue-project-organisation-guidance
