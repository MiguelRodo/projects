name: Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f LICENSE
          test -f docs/architecture/v1-boundaries.md
          test -f skills/github-project-admin/SKILL.md
          test -f AGENTS.md
          test -f .projects/project.md
          test -f .github/workflows/project-admin-bridge.yml
          test -f skills/github-project-admin/references/automation-bridge.md
          test -f skills/github-project-admin/schemas/project-admin-operation-v1.schema.json
          test -f skills/github-project-admin/scripts/apply-project-operation.mjs

      - name: Test github-project-admin skill
        shell: bash
        run: bash skills/github-project-admin/tests/run.sh

      - name: Test Project administration bridge
        shell: bash
        run: bash skills/github-project-admin/tests/project-admin-bridge-static.sh

      - name: Validate this repository's Project contract
        shell: bash
        run: bash skills/github-project-admin/scripts/validate-contract.sh .

      - name: Verify pre-CLI boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cmd/projects
          test ! -e cmd/projectscli
          test ! -e projects.go

      - name: Check whitespace
        run: git diff --check
