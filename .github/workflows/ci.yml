name: Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f LICENSE
          test -f docs/architecture/v1-boundaries.md

      - name: Verify pre-v1 architecture boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cmd/projects
          test ! -e projects.go

      - name: Check whitespace
        run: git diff --check
